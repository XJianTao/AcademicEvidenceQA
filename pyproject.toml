[project]
name = "academic-evidence-qa-m0"
version = "0.1.0"
description = "AcademicEvidenceQA M0 reproducibility and feasibility checks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.7",
  "uvicorn==0.34.3",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.44",
  "alembic==1.17.1",
  "psycopg[binary]==3.2.12",
  "httpx==0.28.1",
  "jieba==0.42.1",
  "pymupdf==1.26.5",
  "python-dotenv==1.2.1",
  "pypdf==5.9.0",
  "qdrant-client==1.15.1",
  "requests==2.34.2",
  "sentence-transformers==5.1.2",
  "transformers==4.57.1",
  "torch==2.8.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["academic_evidence_qa*"]

[tool.setuptools.package-dir]
"" = "src"

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.14.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
files = ["src/academic_evidence_qa/contracts/rag.py", "src/academic_evidence_qa/infrastructure/embedding_client.py"]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
