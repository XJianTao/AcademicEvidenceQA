[project]
name = "academic-evidence-qa-m0"
version = "0.1.0"
description = "AcademicEvidenceQA M0 reproducibility and feasibility checks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "pymupdf==1.26.5",
  "python-dotenv==1.2.1",
  "qdrant-client==1.15.1",
  "requests==2.34.2",
  "sentence-transformers==5.1.2",
  "transformers==4.57.1",
  "torch==2.8.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["academic_evidence_qa*"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
