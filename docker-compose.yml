services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-academic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-academic_evidence}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - academic_evidence_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.16
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-56333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-56334}:6334"
    volumes:
      - academic_evidence_qdrant:/qdrant/storage
    healthcheck:
      # 镜像不保证提供 curl；检查 Qdrant 在容器内监听 HTTP 端口，再由 M0 脚本验证 API。
      test: ["CMD-SHELL", "grep -q ':18BD ' /proc/net/tcp || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  academic_evidence_pgdata:
  academic_evidence_qdrant:
